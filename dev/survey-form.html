<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Опрос FRKN</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 16px;
      background: #0b0d12;
      color: #e6e8ef;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #121621;
      border-radius: 16px;
      padding: 32px;
    }
    h1 {
      margin: 0 0 8px;
      color: #5b7cfa;
      font-size: 24px;
    }
    p {
      margin: 0 0 24px;
      color: #9aa1b2;
      font-size: 14px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #9aa1b2;
    }
    input[type="email"] {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #2a2f3e;
      background: #1a1f2e;
      color: #fff;
      font-size: 16px;
      margin-bottom: 16px;
    }
    input[type="email"]:focus {
      outline: none;
      border-color: #5b7cfa;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #5b7cfa, #22d3ee);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .message.success {
      display: block;
      background: #1a3a2f;
      color: #4ade80;
    }
    .message.error {
      display: block;
      background: #3a1a1a;
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Опрос FRKN</h1>
    <p>Заполните форму и получите ключ бесплатно.</p>

    <form id="survey-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <button type="submit" id="submit-btn">Получить ключ</button>
    </form>

    <div id="message" class="message"></div>
  </div>

  <script>
    const API_URL = 'https://api.frkn.org/surveys/reward';
    const CAMPAIGN_TOKEN = 'secret-token-for-apps-script';

    const form = document.getElementById('survey-form');
    const submitBtn = document.getElementById('submit-btn');
    const messageEl = document.getElementById('message');

    function showMessage(text, isError) {
      messageEl.textContent = text;
      messageEl.className = 'message ' + (isError ? 'error' : 'success');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      messageEl.className = 'message';

      const email = document.getElementById('email').value.trim().toLowerCase();

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + CAMPAIGN_TOKEN,
          },
          body: JSON.stringify({ email }),
        });

        const data = await response.json();

        if (response.ok && data.rewarded) {
          showMessage('Ключ отправлен на ваш email. Проверьте почту (и спам).', false);
          form.reset();
        } else if (data.reason === 'already_rewarded') {
          showMessage('Вы уже получали ключ на этот email.', true);
        } else if (data.reason === 'out_of_keys') {
          showMessage('Ключи временно закончились. Попробуйте позже.', true);
        } else {
          showMessage(data.message || 'Что-то пошло не так.', true);
        }
      } catch (err) {
        showMessage('Ошибка соединения. Попробуйте позже.', true);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
