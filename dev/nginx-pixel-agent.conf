# Example nginx server block for the pixel-agent admin UI.
# Assumes pixel-agent listens on 127.0.0.1:9102.

server {
    listen 443 ssl http2;
    server_name pixel-admin.frkn.org;

    ssl_certificate /etc/letsencrypt/live/pixel-admin.frkn.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixel-admin.frkn.org/privkey.pem;

    # Optional: basic auth
    # auth_basic "Pixel Admin";
    # auth_basic_user_file /etc/nginx/.htpasswd_pixel;

    location / {
        proxy_pass http://127.0.0.1:9102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
