[service]
log_level = "info"
snapshot_interval = 60
snapshot_path = "/var/lib/fcore/node/snapshot-node.bin"

# Startup validation of the snapshot against api, and the hourly drift check.
# A snapshot whose per-tag counts no longer match what api would send is moved
# aside (.stale-<ts>) and the node starts from a full sync instead of serving a
# subset of the peers. A snapshot written by another env/pool is fatal: it is an
# operator error, and the node refuses to start with a foreign file.
[snapshot]
validate_on_start = true
max_divergence_percent = 5
max_divergence_records = 20
drift_check_sec = 3600
updates_endpoint_zmq = "tcp://localhost:3001"

[xray]
enabled = true
path = "/opt/xray/xray-config.json"

[h2]
enabled = true
# Hysteria2's own config file is the single source of truth for what this node
# announces (port from `listen`, name from `host` or the first `acme.domains`
# entry). fnode never starts the process: it lives in its own systemd unit.
path = "/opt/hysteria/config.yaml"

[wg]
enabled = false
path = "/etc/wireguard/utun7.conf"
# Optional: PersistentKeepalive (seconds) injected into client configs.
# Do NOT put PersistentKeepalive into the interface .conf — wg-quick/awg
# refuse to start with it in [Interface]. Default when unset: 25.
# keepalive = 25

[awg]
enabled = false
path = "/etc/amnezia-wg/awg.conf"
# keepalive = 25

# Second AmneziaWG interface (awg1) for AmneziaWgMobile connections with the
# dedicated address pool. Config file has the same format as [awg].
[awg_mobile]
enabled = false
path = "/etc/amnezia-wg/awg1.conf"
# keepalive = 25

# Peers plane: a separate AmneziaWG interface whose members are created by the
# api (POST /v1/peers), not by this node. The address comes from the api too:
# a node here only programs what it was told. Bring the device up yourself
# (`awg-quick up awg0-peer`) — fnode connects and refuses to start if it is
# missing. File format is the same as [awg].
[awg_peers]
enabled = false
path = "/etc/amnezia/awg0-peer.conf"
# keepalive = 25

# Same for plain WireGuard (routers, Linux clients).
[wg_peers]
enabled = false
path = "/etc/wireguard/wg0-peer.conf"
# keepalive = 25

[mtproto]
enabled = false
path = "/opt/teleproxy/config.toml"

[node]
# The shard this node serves. The id is opaque and immutable (`0001`): the plan,
# the human title and the locations inside it live in the api
# (`SELECT * FROM shard_overview`). `shard = "0001"` is accepted as an alias of
# `env`, so new configs read naturally and old files keep working.
env = "experimental"
hostname = "node.local"
default_interface = "eth0"
address = "192.168.1.100"
uuid = "ab514c21-aaaa-bbbb-cccc-32f8cb1ada40"
label = "🏴‍☠️ Node"
max_bandwidth_bps = 1000000000 # 1 Gbps
country = "RU"
type = "common"
# Optional cluster FQDN. When set, client configs use this domain instead of the node IP.
# cluster = "node-cdn.example.com"
# Entry points of this node — the ONE shape everything speaks (node config,
# node -> api announcement, api -> client payload). One [[node.endpoints]]
# block per address; the first one MUST equal `address` above.
#
#   ip     — a public IPv4 (required, unique within the node)
#   port   — optional, default = the inbound's port for the protocol
#   weight — optional, default 100; the client splits traffic by these numbers
#   label  — optional, logs only (never parsed by a client)
#
# Clients pick/rotate addresses themselves. Omit the section for a
# single-address node (the api then expands `address` into the same shape).
# [[node.endpoints]]
# ip = "82.148.231.161"
# port = 443
# weight = 200
# label = "nl-01"
#
# [[node.endpoints]]
# ip = "82.148.231.162"
# weight = 100
#
# DEPRECATED: the two keys below are the legacy form of the section above and
# are ignored (with a warning) when [[node.endpoints]] is present. They keep
# working unchanged, and the node reports `endpoints_legacy: true` to the api
# (/status) until they are migrated. Remove them once no node reports
# endpoints_legacy; `env/dev/scripts/migrate-node-endpoints.py` converts a
# config in place (idempotent, keeps a backup).
# node_ips = ["192.168.1.100", "192.168.1.101"]
# Optional pool/group name. Clients group identically-named nodes and show a
# localized title (falling back to `label`). `pool_translation` maps a
# language code -> display name; en/ru/uk are used, `ua` is accepted as an
# alias of `uk`. Blank values are ignored and never overwrite stored ones.
# pool = "Finland"
# pool_translation = { en = "Finland", ru = "Финляндия", uk = "Фінляндія" }
# Country of the POOL (not of this machine): the flag under the card's name.
# One pool may span countries, so it is declared here and every node of the
# pool should send the same value; 2-3 latin letters, anything else is dropped.
# Absent = the card falls back to the node's own `country`.
# pool_country_code = "NL"
# Optional human name of that country; absent means the client translates the
# code itself.
# pool_country_name = "Netherlands"
# DEPRECATED (see above): per-address weights as `address -> weight`. Express
# them as `weight =` on the matching [[node.endpoints]] entry instead; a
# missing weight means 100 and zero/negative is treated as "not set" (100).
# node_weights = { "192.168.1.100" = 75, "192.168.1.101" = 25 }
# Optional base URL of THIS node's speed-test endpoint: where the bench serves
# `/speedtest/1mb.test`, `/speedtest/10mb.test`, `/speedtest/ping.txt`. The node
# sends it at registration; the api stores it (`nodes.bench_url`) and publishes
# it verbatim as `speedtest_url` in the public `/status`. Must be
# `http(s)://<host>[:port][/path]` — a trailing slash is stripped, a value
# without http(s) or a host is ignored with a warning. Omit the key when the
# node has no bench (premium slots): absent means "do not change the stored
# value", so a re-registration never wipes a URL set another way.
# bench_url = "https://ncr-nl-ams-bench-01.bench.beacon.frkn.org:19443"

[api]
endpoint = "http://127.0.0.1:3000"
token = "change-me-in-production"

[metrics]
publisher = "tcp://localhost:3002"
interval = 30
enabled = true
endpoint = "0.0.0.0:3000"
