[service]
log_level = "info"
snapshot_interval = 60
snapshot_path = "/var/lib/fcore/node/snapshot-node.bin"
updates_endpoint_zmq = "tcp://localhost:3001"

[xray]
enabled = true
path = "/opt/xray/xray-config.json"

[h2]
enabled = true
path = "/opt/hysteria/config.yaml"

[wg]
enabled = false
path = "/etc/wireguard/utun7.conf"
# Optional: PersistentKeepalive (seconds) injected into client configs.
# Do NOT put PersistentKeepalive into the interface .conf — wg-quick/awg
# refuse to start with it in [Interface]. Default when unset: 25.
# keepalive = 25

[awg]
enabled = false
path = "/etc/amnezia-wg/awg.conf"
# keepalive = 25

# Second AmneziaWG interface (awg1) for AmneziaWgMobile connections with the
# dedicated address pool. Config file has the same format as [awg].
[awg_mobile]
enabled = false
path = "/etc/amnezia-wg/awg1.conf"
# keepalive = 25

[mtproto]
enabled = false
path = "/opt/teleproxy/config.toml"

[node]
env = "experimental"
hostname = "node.local"
default_interface = "eth0"
address = "192.168.1.100"
uuid = "ab514c21-aaaa-bbbb-cccc-32f8cb1ada40"
label = "🏴‍☠️ Node"
max_bandwidth_bps = 1000000000 # 1 Gbps
country = "RU"
type = "common"
# Optional cluster FQDN. When set, client configs use this domain instead of the node IP.
# cluster = "node-cdn.example.com"
# Optional extra entry IPs for one node (anti IP-blocking). The first IP is
# the primary and MUST equal `address` above; all IPs share the same
# ports/keys/inbounds — only the entry address differs. Clients pick/rotate
# addresses themselves. Omit for a single-address node.
# node_ips = ["192.168.1.100", "192.168.1.101"]
# Optional pool/group name. Clients group identically-named nodes and show a
# localized title (falling back to `label`). `pool_translation` maps a
# language code -> display name; en/ru/uk are used, `ua` is accepted as an
# alias of `uk`. Blank values are ignored and never overwrite stored ones.
# pool = "Finland"
# pool_translation = { en = "Finland", ru = "Финляндия", uk = "Фінляндія" }
# Optional per-address weights for the pool: address -> weight (default 100).
# Addresses of one node and of neighbour nodes may share the same weight; the
# api hands the client `node_weights{ip: weight}` and the client splits traffic
# by these numbers. Missing address = 100. Zero/negative = "not set" (100).
# node_weights = { "192.168.1.100" = 75, "192.168.1.101" = 25 }

[api]
endpoint = "http://127.0.0.1:3000"
token = "change-me-in-production"

[metrics]
publisher = "tcp://localhost:3002"
interval = 30
enabled = true
endpoint = "0.0.0.0:3000"
