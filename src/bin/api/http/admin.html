<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fcore admin</title>
<style>
  :root { --bg: #f5f6f8; --card: #fff; --text: #222; --muted: #666; --border: #ddd; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  header { background: #1a1a2e; color: #fff; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 1.2rem; }
  main { padding: 1.5rem; max-width: 1400px; margin: 0 auto; }
  .token-bar { background: var(--card); border: 1px solid var(--border); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; display: flex; gap: 0.5rem; align-items: center; }
  .token-bar input { flex: 1; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; }
  .token-bar button { padding: 0.5rem 1rem; background: #1a1a2e; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  .token-bar button:hover { opacity: 0.9; }
  #status { font-size: 0.85rem; color: var(--muted); margin-left: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
  .card h3 { margin: 0 0 0.5rem; font-size: 0.9rem; color: var(--muted); text-transform: uppercase; }
  .card .value { font-size: 1.8rem; font-weight: 600; }
  .card .sub { font-size: 0.85rem; color: var(--muted); margin-top: 0.25rem; }
  section { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; overflow-x: auto; }
  section h2 { margin: 0 0 1rem; font-size: 1.1rem; display: flex; align-items: center; gap: 0.75rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { padding: 0.5rem; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  th { background: #fafafa; font-weight: 600; }
  tr:hover { background: #f9f9f9; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: #f0f4ff; }
  .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
  .online { background: #d1fae5; color: #065f46; }
  .offline { background: #fee2e2; color: #991b1b; }
  .deleted { background: #f3f4f6; color: #6b7280; }
  .active { background: #dbeafe; color: #1e40af; }
  .inactive { background: #fef3c7; color: #92400e; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; }
  .error { color: #991b1b; }
  .details { margin: 0.25rem 0 0.75rem; padding: 0.75rem; background: #f9fafb; border: 1px solid var(--border); border-radius: 6px; }
  .details h4 { margin: 0 0 0.5rem; font-size: 0.95rem; }
  .small { font-size: 0.8rem; color: var(--muted); }
  .nowrap { white-space: nowrap; }
  .btn { padding: 0.35rem 0.75rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
  .btn-primary { background: #1a1a2e; color: #fff; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-danger { background: #991b1b; color: #fff; }
  .btn-danger:hover { background: #7f1d1d; }
  .btn-sm { padding: 0.2rem 0.5rem; font-size: 0.75rem; }
  .form-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; align-items: end; }
  .form-row input, .form-row select { padding: 0.4rem; border: 1px solid var(--border); border-radius: 4px; font-size: 0.85rem; }
  .form-row label { display: flex; flex-direction: column; font-size: 0.8rem; color: var(--muted); gap: 0.15rem; }
  .form-inline { background: #f9fafb; border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem; margin-top: 0.75rem; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>fcore admin</h1>
</header>
<main>
  <div class="token-bar">
    <input id="token" type="password" placeholder="admin token" autocomplete="off">
    <button onclick="loadAll()">Connect / Refresh</button>
    <span id="status"></span>
  </div>

  <div class="grid" id="dashboard"></div>

  <section>
    <h2>Nodes
      <button class="btn btn-primary" onclick="toggleNodeForm()">+ Add node</button>
    </h2>
    <div id="node-form" class="form-inline hidden">
      <div class="form-row">
        <label>Env <input id="node-env" placeholder="production"></label>
        <label>Hostname <input id="node-hostname" placeholder="node1.example.com"></label>
        <label>Address <input id="node-address" placeholder="10.0.0.1"></label>
        <label>Label <input id="node-label" placeholder="FRA-01"></label>
        <label>Country <input id="node-country" placeholder="DE"></label>
        <label>Cluster <input id="node-cluster" placeholder="eu-west"></label>
        <label>Cores <input id="node-cores" type="number" value="4"></label>
        <label>Max bps <input id="node-bps" type="number" value="1000000000"></label>
      </div>
      <div class="form-row">
        <label style="flex:1">Inbounds (JSON)
          <input id="node-inbounds" style="width:100%; min-width:400px" placeholder='{ "VlessTcpReality": {} }'>
        </label>
        <button class="btn btn-primary" onclick="createNode()">Create</button>
      </div>
    </div>
    <div id="nodes"></div>
  </section>

  <section>
    <h2>Subscriptions
      <button class="btn btn-primary" onclick="toggleSubForm()">+ Create subscription</button>
    </h2>
    <div class="form-inline">
      <div class="form-row">
        <label>State
          <select id="sub-filter-state" onchange="applySubscriptionFilters()">
            <option value="all">All</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </label>
        <label>Sort by
          <select id="sub-sort" onchange="applySubscriptionFilters()">
            <option value="traffic">Traffic total</option>
            <option value="uplink">Uplink</option>
            <option value="downlink">Downlink</option>
            <option value="expires_asc">Expires soonest</option>
            <option value="expires_desc">Expires latest</option>
          </select>
        </label>
        <label>Search
          <input id="sub-search" type="text" placeholder="uuid or ref code" oninput="applySubscriptionFilters()">
        </label>
      </div>
    </div>
    <div id="sub-form" class="form-inline hidden">
      <div class="form-row">
        <label>Days <input id="sub-days" type="number" value="30"></label>
        <label>Limit bytes <input id="sub-limit" type="number" placeholder="optional"></label>
        <label>Refer code <input id="sub-refcode" placeholder="auto"></label>
        <label>Referred by <input id="sub-referred" placeholder="optional"></label>
        <button class="btn btn-primary" onclick="createSubscription()">Create</button>
      </div>
    </div>
    <div id="subscriptions"></div>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  let token = localStorage.getItem('fc_admin_token') || '';
  let allSubscriptions = [];
  const urlParams = new URLSearchParams(window.location.search);
  const tokenFromUrl = urlParams.get('token');
  if (tokenFromUrl) {
    token = tokenFromUrl;
    localStorage.setItem('fc_admin_token', token);
  }
  $('token').value = token;

  async function api(path, opts = {}) {
    const r = await fetch(path, {
      ...opts,
      headers: {
        'Authorization': 'Bearer ' + token,
        ...(opts.headers || {})
      }
    });
    if (r.status === 401) {
      setStatus('Unauthorized — check token', true);
      throw new Error('unauthorized');
    }
    if (!r.ok) {
      const text = await r.text();
      throw new Error(text || r.statusText);
    }
    const ct = r.headers.get('content-type') || '';
    return ct.includes('application/json') ? r.json() : r.text();
  }

  async function apiPost(path, body) {
    return api(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  }

  async function apiDelete(path) {
    return api(path, { method: 'DELETE' });
  }

  function setStatus(msg, isError) {
    const el = $('status');
    el.textContent = msg;
    el.className = isError ? 'error' : '';
  }

  function formatBytes(b) {
    if (b === 0 || b == null) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    let n = Number(b);
    while (n >= 1024 && i < units.length - 1) {
      n /= 1024;
      i++;
    }
    return n.toFixed(i === 0 ? 0 : 2) + ' ' + units[i];
  }

  function formatBits(bps) {
    if (bps === 0 || bps == null) return '0 bps';
    const units = ['bps', 'Kbps', 'Mbps', 'Gbps'];
    let i = 0;
    let n = Number(bps) * 8;
    while (n >= 1000 && i < units.length - 1) {
      n /= 1000;
      i++;
    }
    return n.toFixed(i === 0 ? 0 : 2) + ' ' + units[i];
  }

  function formatPercent(p) {
    if (p == null) return '-';
    return p.toFixed(1) + '%';
  }

  function toggleSubForm() {
    $('sub-form').classList.toggle('hidden');
  }

  function toggleNodeForm() {
    $('node-form').classList.toggle('hidden');
  }

  async function createSubscription() {
    const days = parseInt($('sub-days').value, 10);
    const limit = $('sub-limit').value.trim();
    const referCode = $('sub-refcode').value.trim();
    const referredBy = $('sub-referred').value.trim() || null;
    const body = {
      days: isNaN(days) ? null : days,
      limit_bytes: limit ? parseInt(limit, 10) : null,
      refer_code: referCode || null,
      referred_by: referredBy
    };
    try {
      await apiPost('/subscription', body);
      setStatus('Subscription created');
      toggleSubForm();
      await loadSubscriptions();
    } catch (e) {
      setStatus('Create subscription failed: ' + e.message, true);
    }
  }

  async function createConnection(subId) {
    const env = $(`conn-env-${subId}`).value.trim();
    const proto = $(`conn-proto-${subId}`).value;
    const days = parseInt($(`conn-days-${subId}`).value, 10);
    if (!env) { setStatus('Env is required', true); return; }
    try {
      await apiPost('/connection', {
        env,
        subscription_id: subId,
        proto,
        days: isNaN(days) ? null : days
      });
      setStatus('Connection created');
      // refresh connections for this subscription
      const connsDiv = $(`sub-conns-${subId}`);
      connsDiv.dataset.loaded = 'false';
      await toggleSubscription(subId);
    } catch (e) {
      setStatus('Create connection failed: ' + e.message, true);
    }
  }

  async function createNode() {
    const env = $('node-env').value.trim();
    const hostname = $('node-hostname').value.trim();
    const address = $('node-address').value.trim();
    if (!env || !hostname || !address) {
      setStatus('Env, hostname and address are required', true);
      return;
    }
    let inbounds = {};
    const rawInbounds = $('node-inbounds').value.trim();
    if (rawInbounds) {
      try { inbounds = JSON.parse(rawInbounds); }
      catch (e) { setStatus('Invalid inbounds JSON', true); return; }
    }
    const body = {
      env,
      hostname,
      address,
      inbounds,
      uuid: crypto.randomUUID(),
      label: $('node-label').value.trim() || hostname,
      interface: 'eth0',
      cores: parseInt($('node-cores').value, 10) || 4,
      max_bandwidth_bps: parseInt($('node-bps').value, 10) || 1000000000,
      country: $('node-country').value.trim() || 'XX',
      type: 'Node',
      cluster: $('node-cluster').value.trim() || null
    };
    try {
      await apiPost('/node', body);
      setStatus('Node created');
      toggleNodeForm();
      await loadNodes();
    } catch (e) {
      setStatus('Create node failed: ' + e.message, true);
    }
  }

  async function deleteNode(id) {
    if (!confirm('Delete node ' + id + '?')) return;
    try {
      await apiDelete('/node/' + id);
      setStatus('Node deleted');
      await loadNodes();
    } catch (e) {
      setStatus('Delete node failed: ' + e.message, true);
    }
  }

  function renderState(s) {
    $('dashboard').innerHTML = `
      <div class="card"><h3>Nodes</h3><div class="value">${s.nodes.online}</div><div class="sub">online / ${s.nodes.total} total</div></div>
      <div class="card"><h3>Connections</h3><div class="value">${s.connections.active}</div><div class="sub">active / ${s.connections.total} total</div></div>
      <div class="card"><h3>Subscriptions</h3><div class="value">${s.subscriptions.active}</div><div class="sub">active / ${s.subscriptions.total} total</div></div>
    `;
  }

  function renderNodes(data) {
    const expanded = new Set();
    document.querySelectorAll('[id^="node-details-"]').forEach(el => {
      if (el.style.display !== 'none') {
        const id = el.id.replace('node-details-', '');
        expanded.add(id);
      }
    });

    const rows = data.nodes.map(n => {
      const m = n.metrics || {};
      const load = m.cpu_percent != null ? m.cpu_percent : null;
      return `
      <tr class="clickable" onclick="toggleNode('${n.id}')">
        <td class="mono">${n.id}</td>
        <td><strong>${n.label}</strong></td>
        <td class="mono">${n.address}</td>
        <td><span class="badge ${n.status.toLowerCase()}">${n.status}</span></td>
        <td class="nowrap">${load != null ? load.toFixed(1) + '%' : '-'}</td>
        <td><button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); deleteNode('${n.id}')">Delete</button></td>
      </tr>
      <tr>
        <td colspan="6" id="node-details-${n.id}" class="details" style="display:none">
          <div id="node-metrics-${n.id}">Loading…</div>
        </td>
      </tr>`;
    }).join('');
    $('nodes').innerHTML = rows
      ? `<table><tr><th>ID</th><th>Label</th><th>Address</th><th>Status</th><th>Load</th><th></th></tr>${rows}</table>`
      : '<p>No nodes</p>';

    expanded.forEach(id => toggleNode(id));
  }

  function applySubscriptionFilters() {
    const state = $('sub-filter-state').value;
    const sort = $('sub-sort').value;
    const search = $('sub-search').value.trim().toLowerCase();

    let list = allSubscriptions.slice();

    if (state === 'active') list = list.filter(s => s.is_active);
    if (state === 'inactive') list = list.filter(s => !s.is_active);
    if (search) {
      list = list.filter(s =>
        s.id.toLowerCase().includes(search) ||
        (s.refer_code && s.refer_code.toLowerCase().includes(search))
      );
    }

    list.sort((a, b) => {
      switch (sort) {
        case 'uplink': return (b.traffic?.uplink || 0) - (a.traffic?.uplink || 0);
        case 'downlink': return (b.traffic?.downlink || 0) - (a.traffic?.downlink || 0);
        case 'traffic':
        default: {
          const ta = (a.traffic?.uplink || 0) + (a.traffic?.downlink || 0);
          const tb = (b.traffic?.uplink || 0) + (b.traffic?.downlink || 0);
          return tb - ta;
        }
        case 'expires_asc':
          if (!a.expires_at && !b.expires_at) return 0;
          if (!a.expires_at) return 1;
          if (!b.expires_at) return -1;
          return new Date(a.expires_at) - new Date(b.expires_at);
        case 'expires_desc':
          if (!a.expires_at && !b.expires_at) return 0;
          if (!a.expires_at) return 1;
          if (!b.expires_at) return -1;
          return new Date(b.expires_at) - new Date(a.expires_at);
      }
    });

    renderSubscriptions(list);
  }

  function renderSubscriptions(subscriptions) {
    if (!subscriptions || !subscriptions.length) {
      $('subscriptions').innerHTML = '<p>No subscriptions</p>';
      return;
    }

    const rows = subscriptions.map(s => `
      <tr class="clickable" onclick="toggleSubscription('${s.id}')">
        <td class="mono">${s.id}</td>
        <td>${s.expires_at ? new Date(s.expires_at).toLocaleString() : '-'}</td>
        <td><span class="badge ${s.is_active ? 'active' : 'inactive'}">${s.is_active ? 'active' : 'inactive'}</span></td>
        <td class="nowrap">${s.limit_bytes != null ? formatBytes(s.limit_bytes) : '-'}</td>
        <td>${s.connections_count}</td>
        <td>${s.online || 0}</td>
        <td class="nowrap">↓${formatBytes(s.traffic.downlink)} / ↑${formatBytes(s.traffic.uplink)}</td>
      </tr>
      <tr>
        <td colspan="7" id="sub-details-${s.id}" class="details" style="display:none">
          <h4>Connections</h4>
          <div id="sub-conns-${s.id}">Loading…</div>
          <div class="form-inline">
            <h4>Create connection</h4>
            <div class="form-row">
              <label>Env <input id="conn-env-${s.id}" placeholder="production"></label>
              <label>Proto
                <select id="conn-proto-${s.id}">
                  <option>Wireguard</option>
                  <option>AmneziaWg</option>
                  <option>VlessTcpReality</option>
                  <option>VlessGrpcReality</option>
                  <option>VlessXhttpReality</option>
                  <option>VlessXhttpCdn</option>
                  <option>Vmess</option>
                  <option>Shadowsocks</option>
                  <option>Hysteria2</option>
                  <option>Mtproto</option>
                </select>
              </label>
              <label>Days <input id="conn-days-${s.id}" type="number" value="30"></label>
              <button class="btn btn-primary" onclick="event.stopPropagation(); createConnection('${s.id}')">Create</button>
            </div>
          </div>
        </td>
      </tr>
    `).join('');

    $('subscriptions').innerHTML = `<table><tr><th>ID</th><th>Expires</th><th>State</th><th>Limit</th><th>Connections</th><th>Online</th><th>Traffic</th></tr>${rows}</table>`;
  }

  function renderConnectionRows(conns) {
    if (!conns || !conns.length) return '<p class="small">No connections</p>';
    const rows = conns.map(c => `
      <tr>
        <td class="mono">${c.id}</td>
        <td>${c.env}</td>
        <td>${c.proto}</td>
        <td>${c.online || 0}</td>
        <td>${c.expires_at ? new Date(c.expires_at).toLocaleString() : '-'}</td>
        <td><span class="badge ${c.is_deleted ? 'deleted' : 'active'}">${c.is_deleted ? 'deleted' : 'active'}</span></td>
        <td class="nowrap">↓${formatBytes(c.downlink)} / ↑${formatBytes(c.uplink)}</td>
      </tr>
    `).join('');
    return `<table><tr><th>ID</th><th>Env</th><th>Proto</th><th>Online</th><th>Expires</th><th>State</th><th>Traffic</th></tr>${rows}</table>`;
  }

  async function toggleSubscription(id) {
    const details = $(`sub-details-${id}`);
    const connsDiv = $(`sub-conns-${id}`);
    if (details.style.display === 'none') {
      details.style.display = 'table-cell';
      if (connsDiv.dataset.loaded !== 'true') {
        try {
          const data = await api(`/admin/api/subscriptions/${id}/connections`);
          connsDiv.innerHTML = renderConnectionRows(data.connections);
          connsDiv.dataset.loaded = 'true';
        } catch (e) {
          connsDiv.innerHTML = '<p class="error">Failed to load connections</p>';
        }
      }
    } else {
      details.style.display = 'none';
    }
  }

  async function toggleNode(id) {
    const details = $(`node-details-${id}`);
    const metricsDiv = $(`node-metrics-${id}`);
    if (details.style.display === 'none') {
      details.style.display = 'table-cell';
      if (metricsDiv.dataset.loaded !== 'true') {
        try {
          const from = Date.now() - 10 * 60 * 1000;
          const data = await api(`/admin/api/nodes/${id}/metrics?from=${from}`);
          metricsDiv.innerHTML = renderNodeMetrics(id, data);
          metricsDiv.dataset.loaded = 'true';
          drawAllNodeCharts(id, data);
        } catch (e) {
          metricsDiv.innerHTML = '<p class="error">Failed to load metrics: ' + e.message + '</p>';
        }
      }
    } else {
      details.style.display = 'none';
    }
  }

  function renderNodeMetrics(nodeId, data) {
    if (!data.metrics || !data.metrics.length) {
      return '<p class="small">No metrics available</p>';
    }

    const latest = {};
    data.metrics.forEach(m => {
      const last = m.points[m.points.length - 1];
      latest[m.name] = last ? last.y : null;
    });

    const cpu = latest['sys.cpu.avg'] != null ? latest['sys.cpu.avg'] : (Object.keys(latest).filter(k => k.startsWith('sys.cpu.')).reduce((a, k) => a + (latest[k] || 0), 0) / Object.keys(latest).filter(k => k.startsWith('sys.cpu.')).length || 0);
    const memUsed = latest['sys.mem_used'];
    const memTotal = latest['sys.mem_total'];
    const memPct = memUsed != null && memTotal != null ? (memUsed / memTotal * 100) : null;
    const load1 = latest['sys.loadavg_1'];
    const diskRoot = latest['sys.disk.root.usage_percent'];

    const info = [];
    if (cpu != null) info.push(`CPU: ${cpu.toFixed(1)}%`);
    if (memUsed != null) info.push(`Memory: ${formatBytes(memUsed)} / ${formatBytes(memTotal || 0)} (${memPct != null ? memPct.toFixed(1) : '-'}%)`);
    if (load1 != null) info.push(`Load 1m: ${load1.toFixed(2)}`);
    if (diskRoot != null) info.push(`Disk root: ${diskRoot.toFixed(1)}%`);

    return `
      <h4>Overview</h4>
      <p class="small">${info.join(' · ') || 'No recent system metrics'}</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem;margin-top:0.75rem">
        <div class="card"><h5>CPU %</h5><canvas id="chart-${nodeId}-cpu" height="120"></canvas></div>
        <div class="card"><h5>Memory used</h5><canvas id="chart-${nodeId}-mem" height="120"></canvas></div>
        <div class="card"><h5>Network bps</h5><canvas id="chart-${nodeId}-net" height="120"></canvas></div>
        <div class="card"><h5>Load average</h5><canvas id="chart-${nodeId}-load" height="120"></canvas></div>
      </div>
      <h4 style="margin-top:1rem">All series</h4>
      <table class="small">
        <tr><th>Metric</th><th>Latest</th><th>Points</th></tr>
        ${data.metrics.map(m => {
          const last = m.points[m.points.length - 1];
          return `<tr><td>${m.name}</td><td>${last ? last.y.toFixed(2) : '-'}</td><td>${m.points.length}</td></tr>`;
        }).join('')}
      </table>
    `;
  }

  function drawAllNodeCharts(nodeId, data) {
    const cpuSeries = data.metrics.filter(m => m.name.startsWith('sys.cpu.'));
    const memSeries = data.metrics.filter(m => m.name === 'sys.mem_used');
    const netRx = data.metrics.filter(m => m.name.match(/^net\..+\.rx_bps$/));
    const netTx = data.metrics.filter(m => m.name.match(/^net\..+\.tx_bps$/));
    const loadSeries = data.metrics.filter(m => m.name.startsWith('sys.loadavg_'));

    const merge = (series) => {
      const map = new Map();
      series.forEach(s => {
        s.points.forEach(p => {
          const v = map.get(p.x) || 0;
          map.set(p.x, v + p.y);
        });
      });
      return Array.from(map.entries()).sort((a, b) => a[0] - b[0]).map(([x, y]) => ({ x, y }));
    };

    drawChart(`chart-${nodeId}-cpu`, merge(cpuSeries), 'CPU %', '#1a1a2e');
    drawChart(`chart-${nodeId}-mem`, merge(memSeries), 'Memory used', '#2563eb');
    drawChart(`chart-${nodeId}-net`, merge([...netRx, ...netTx]), 'bps ×8', '#16a34a');
    drawChart(`chart-${nodeId}-load`, merge(loadSeries), 'Load', '#d97706');
  }

  function drawChart(canvasId, points, label, color) {
    const canvas = document.getElementById(canvasId);
    if (!canvas || !points.length) {
      if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#999';
        ctx.fillText('No data', 10, 60);
      }
      return;
    }
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(300, Math.floor(rect.width)) || 300;
    canvas.height = 120;
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;
    const pad = 20;

    const minX = points[0].x;
    const maxX = points[points.length - 1].x;
    const values = points.map(p => p.y);
    let minY = Math.min(...values);
    let maxY = Math.max(...values);
    if (minY === maxY) { minY = 0; maxY = maxY || 1; }

    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = '#e5e7eb';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad, pad);
    ctx.lineTo(pad, h - pad);
    ctx.lineTo(w - pad, h - pad);
    ctx.stroke();

    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    points.forEach((p, i) => {
      const x = pad + (maxX === minX ? 0 : (p.x - minX) / (maxX - minX)) * (w - 2 * pad);
      const y = h - pad - (maxY === minY ? 0 : (p.y - minY) / (maxY - minY)) * (h - 2 * pad);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();

    ctx.fillStyle = '#666';
    ctx.font = '10px sans-serif';
    ctx.fillText(label, pad + 4, pad - 4);
    ctx.fillText(maxY.toFixed(1), 2, pad + 8);
    ctx.fillText(minY.toFixed(1), 2, h - pad - 4);
  }

  async function loadNodes() {
    const nodes = await api('/admin/api/nodes');
    renderNodes(nodes);
  }

  async function loadSubscriptions() {
    const data = await api('/admin/api/subscriptions');
    allSubscriptions = data.subscriptions || [];
    applySubscriptionFilters();
  }

  async function loadAll() {
    token = $('token').value.trim();
    localStorage.setItem('fc_admin_token', token);
    setStatus('loading...');
    try {
      const [state, nodes, subscriptions] = await Promise.all([
        api('/admin/api/state'),
        loadNodes(),
        loadSubscriptions()
      ]);
      renderState(state);
      setStatus('ok — ' + new Date().toLocaleTimeString());
    } catch (e) {
      if (e.message !== 'unauthorized') setStatus('error: ' + e.message, true);
    }
  }

  loadAll();
  setInterval(loadAll, 30000);
</script>
</body>
