[service]
listen = "127.0.0.1"
port = 3000
token = "change-me-in-production"
key_sign_token = [1, 2, 3, 4, 5, 6, 7, 8]
cors_origins = ["http://localhost:8080"]
wireguard_network = "10.0.0.0/8"
amnezia_wireguard_network = "10.0.0.0/8"
# Dedicated pool for AmneziaWgMobile connections (outside CGNAT 100.64.0.0/10).
# Without it AmneziaWgMobile connections cannot be created.
# amnezia_wireguard_mobile_network = "10.77.0.0/16"
log_level = "info"
updates_endpoint_zmq = "tcp://*:3001"
subscription_title = "FRKN Subscription"
support_contact = "https://t.me/frkn_support"
base_url = "https://frkn.org"
# Public base URL of this api instance — used for machine-facing links
# (share feed /sub/<token>). Defaults to base_url when unset.
api_url = "https://api.frkn.org"
admin_enabled = true
admin_token = "change-me-in-production"
agw_private_key_path = "/etc/fcore/api/agw_private.pem"
# mrkting = { endpoint = "https://api.frkn.org", token = "change-me" }
# enabled_conns = { dev = ["Hysteria2", "VlessTcpReality"], wl = ["VlessXhttpCdn"], ru = ["Wireguard", "Hysteria2"] }
# Mobile AmneziaWG (dedicated pool): add "AmneziaWgMobile" to the env list, e.g.
# enabled_conns = { ru = ["AmneziaWg", "AmneziaWgMobile", "VlessTcpReality"] }
# Lite (traffic-only) keys: connections for lite activations, same env → tags
# shape as enabled_conns. Falls back to enabled_conns when unset, so lite subs
# get the default set until dedicated lite servers exist.
# lite_enabled_conns = { lite-prod = ["VlessTcpReality", "Hysteria2"] }
# Tariff products (standard, gaming, bs-prem, standard-gaming,
# standard-bs-prem, full): the product → env contract lives in code —
# standard = enabled_conns (wl included), gaming/bs-prem = that env only,
# standard-gaming/standard-bs-prem = enabled_conns + that env, full =
# enabled_conns + gaming + bs-prem. gaming/bs-prem must NOT be added to
# enabled_conns: every standard subscription would receive them.
# Protocols of the envs added by the products (env → tags). An empty list is
# a config error; a missing env makes activation of the products that need it
# fail loudly (500, the key is not consumed) instead of provisioning a
# partial subscription. Keeping the classic set working without these lines
# is fine (deployments that do not sell gaming/bs-prem yet).
# env_proto_templates = { gaming = ["AmneziaWg", "AmneziaWgMobile"], "bs-prem" = ["AmneziaWg"] }
# Labels on the client's service cards (/v1/services). Bare numbers only —
# the client formats them itself. Defaults shown.
# gateway_price_label = "500"
# gateway_speed_label = "1000"
# Traffic mode (beta): an expired subscription with a traffic limit stays
# active while it has bytes left, and traffic top-ups are allowed on expired
# standard subscriptions. Only metered protocols work in traffic mode.
# traffic_mode_enabled = false
# metered_conns = ["Wireguard", "AmneziaWg", "AmneziaWgMobile", "VlessTcpReality", "VlessGrpcReality", "VlessXhttpCdn"]
# POST /v1/nodes/load: nodes do not report their own connection limit yet, so
# one fleet-wide capacity turns their live connection count into conn_util.
# Above the threshold the endpoint reports a hard 1.0 (docs/nodes-load.md).
# node_load_conn_capacity = 300
# node_load_threshold = 0.85
# Node registration vs pool inbounds. A card is one config for the whole pool,
# so what goes into that config must match across its nodes: interface address,
# DNS, keepalive, MTU, the server key and the obfuscation profile. The PORT is
# not part of the comparison — each machine may serve the card on its own port,
# the card carries a per-node endpoint. With true (default) a mismatching node
# is refused with 409 `pool_inbounds_conflict` and the differing fields; it never
# enters the roster and fnode exits instead of retrying. With false the node
# registers as `degraded` and only a warning is logged (deliberate rollouts).
# pool_strict_inbounds = true

# Own nodes. Hosting one node is a capability of any account, not a plan:
# every NEW top-level subscription is created with `own_nodes_limit` equal to
# this value, and that quota is the only gate of POST /private/install-token
# (a user of an own-node account is still refused). Existing rows are never
# backfilled — set the column per account to change one. 0 disables the
# default for newly created accounts.
# [service.private]
# default_own_nodes_limit = 3

# Peers: the client owns the key pair, the api hands out the address.
# `subnets` is the address space of one shard (env); overlapping blocks are
# refused by the database. Every node of an env carries all peers of that env,
# so the block size is the real capacity: /24 = 253 peers, and 10% of the budget
# stays reserved so a burst of re-issues never hits the last host.
# [service.peers]
# enabled = false
# # Live tunnels per physical device, counted by its X25519 public key across
# # every subscription and env: a phone keeps one, a router may keep three up
# # for failover. 0 or no key means 3. Old name: max_per_device.
# peers_per_device = 3
# max_devices_per_subscription = 15
# max_per_subscription = 45
# remember_days = 7
# # A device with no live tunnel and nothing created for this many days is
# # deleted with its revoked peers (default 90, 0 disables). Without it the
# # device cap fills with phones that no longer exist.
# stale_device_days = 90
# subnets = { "0001" = ["10.88.0.0/16"] }
# # Shards whose number is unknown (premium slots, customers' machines) are not
# # listed anywhere: the api carves a /16 for each of them out of this pool on
# # first use.
# auto_subnet_pool = "10.128.0.0/9"
# auto_subnet_prefix = 16
# # How new subscriptions are spread over the shards of a plan.
# # `growth` (default): a shard takes at most its share of the recent signup
# # flow, so a newly added shard ramps up instead of swallowing the whole
# # funnel while the older ones sit on free slots.
# # `equalize`: every signup goes to the least-filled shard; a new shard takes
# # 100% until it catches up, but all shards end at the same fill.
# balancing = "growth"
# # Fill percent at which a shard stops taking NEW signups while another shard of
# # the same plan is still below it. This is what makes a nearly full shard hand
# # its flow to an emptier sibling: at 90% vs 30% the full one gets nothing until
# # the empty one reaches 85%. `0` disables the threshold. A shard at its
# # `max_subscriptions` is skipped regardless, and a user is never refused while
# # any shard has room.
# soft_pct = 85
# # Remove v1 connections whose (env, proto) the subscription no longer holds a
# # grant for: a migration to a shard, a revoked grant, a downgrade. Off until
# # the client can build peers — a pruned connection otherwise leaves the user
# # with nothing. Turn on with prune_dry_run first and read the log for a day.
# prune_legacy_conns = false
# prune_dry_run = true
# prune_max_per_tick = 50

# App Store IAP (POST /v1/subscriptions). Without this section the endpoint answers 503.
# [service.apple]
# key_id = "ABCDEF1234"
# issuer_id = "00000000-0000-0000-0000-000000000000"
# private_key_path = "/etc/fcore/api/SubscriptionKey_ABCDEF1234.p8"
# bundle_id = "org.frkn.app"
# environment = "Sandbox" # or "Production" (Production requires app_apple_id)
# app_apple_id = 1234567890
# root_ca_path = "/etc/fcore/api/AppleRootCA-G3.cer"
# allowed_products = ["frkn_premium_1_month", "frkn_premium_3_month", "frkn_premium_6_month", "frkn_premium_12_month"]



# Node score is observation only. Missing [score] keeps these defaults.
# net.*.tx_bps is bytes/sec (sysinfo). target_bps 625000 = 5 Mbit/s.
# link_capacity 125000000 = 1 Gbit/s. If a node reports cores = 0,
# load uses 1 - clamp(load15, 0, 1) instead of load1/cores.
# [score]
# w_load = 0.25
# w_users = 0.20
# w_bw_capacity = 0.15
# w_bw_per_user = 0.15
# w_reliability = 0.15
# w_uptime = 0.10
# soft_cap = 100
# link_capacity = 125000000
# target_bps = 625000
# stale_after_secs = 600
# interval_secs = 60
# heartbeat_every_secs = 60

[metrics]
reciever = "tcp://0.0.0.0:3002"
max_points = 10000
retention_seconds = 604800 # 7 days
snapshot_path = "/var/lib/fcore/api/metrics.bin"

[metrics.log]
enabled = true
directory = "/var/log/fcore/api"
file = "metrics.log"
rotation = "daily"
level = "info"

[tasks]
db_sync_interval_sec = 1000
subscription_restore_interval = 600
subscription_expire_interval = 600
traffic_persist_interval_sec = 3600
# Lite tariff: how often lite subscriptions are checked against their
# traffic limit (default 300).
# traffic_limit_interval_sec = 300
# Lite tariff: reissue a connection when it stays above the per-connection
# device limit for device_limit_max_ticks consecutive ticks (defaults:
# disabled, 60s interval, 3 ticks).
# device_limit_enabled = false
# device_limit_interval_sec = 60
# Reconcile subscriptions against enabled_conns/lite_enabled_conns: creates
# any missing (env, proto) connection (default 3600).
# conns_reconcile_interval_sec = 3600
# device_limit_max_ticks = 3
# Peers: how often installations with no live tunnel get reaped (default 3600).
# The threshold itself is `[service.peers] stale_device_days`.
# stale_device_interval_sec = 3600
# How many stale devices one pass deletes (default 200; 0 = default).
# stale_device_max_per_tick = 200
# Peers: revoke live tunnels whose traffic was not booked for this many days
# (default 90; 0 switches the age rule off, the subscription/grant checks still
# run), and how often that sweep runs (default 3600).
# peer_idle_days = 90
# peer_reap_interval_sec = 3600
# How many live peers one sweep looks at (default 200; 0 = default), and how
# long to wait before the next pass while a full batch keeps coming back —
# a backlog drains in one afternoon instead of a week (default 5 s).
# peer_reap_max_per_tick = 200
# peer_reap_backlog_pause_sec = 5
# Hard-delete the connections of subscriptions that expired longer than this
# many days ago, with their traffic rows: `cleanup_expired_subscriptions` only
# soft-deletes, and those tombstones are never read again (default 90; 0 keeps
# them forever). How often that purge runs (default 3600), and how many rows
# one statement deletes (default 2000) — a first run drains the backlog in
# batches instead of one huge transaction.
# connection_purge_after_days = 90
# connection_purge_interval_sec = 3600
# connection_purge_max_per_tick = 2000
connection_expire_interval = 600
monitor_nodes_interval = 60
heartbeat_node_offline_threshold_sec = 120

[subscription_audit]
enabled = true
directory = "/var/log/fcore/api"
file = "subscription_audit.log"
rotation = "daily"
level = "info"

[pg]
host = "localhost"
port = 5432
db = "api"
username = "postgres"
password = "change-me"

[alerts]
# Master switch. While this is false the alert rules do not run at all: no
# push, and no `alert_events` rows either.
enabled = true
telegram_bot_token = ""
telegram_chat_id = ""
# Per-channel switch: on/off without deleting the credentials.
telegram_enabled = true
# Channels are independent: an alert goes to every one that is configured —
# Telegram below and/or [alerts.email]. The same set is used by
# POST /v1/admin/alerts/test, watchcat events and snapshot-drift reports, not
# only by the node rules.
# Envs that are logged but never pushed to OUR chat — machines owned by
# customers. Prefix match; an empty list pushes for every env.
# A owner who bound a chat (see subscription_alert_chats) still gets their
# own node alerts: quiet only silences the global channel.
quiet_env_prefixes = ["personal", "custompersonal"]

# Reminder for a group of exits that is still broken (GET/POST exit health from
# the node watchdogs, `POST /v1/admin/alerts/exit`). A transition is mailed at
# once; the same state repeated by the 10 s watchdog tick at most this often.
# exit_reminder_sec = 1800

# Email delivery. Independent of Telegram: both fire when both are set.
# [alerts.email]
# enabled = true           # switch without deleting the SMTP block
# smtp_host = "smtp.yandex.ru"
# smtp_port = 587          # 587 = STARTTLS, 465 = implicit TLS
# tls = "starttls"         # starttls | tls | none
# username = "pigeon@frkn.org"
# password = "change-me"
# from = "FRKN alerts <pigeon@frkn.org>"
# to = ["ops@frkn.org"]

# Сводки по системе в почту: daily каждый день, weekly по понедельникам,
# monthly 1-го числа. Отправляются только если задан [alerts.email].
# [digest]
# enabled = true
# hour = 9                # локальный час отправки
# utc_offset_hours = 3    # МСК
# weekly = true
# monthly = true
