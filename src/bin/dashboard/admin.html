<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRKN Business Dashboard</title>
<style>
  :root { --bg: #f5f6f8; --card: #fff; --text: #222; --muted: #666; --border: #ddd; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  header { background: #1a1a2e; color: #fff; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 1.2rem; }
  main { padding: 1.5rem; max-width: 1400px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
  .card h3 { margin: 0 0 0.5rem; font-size: 0.85rem; color: var(--muted); text-transform: uppercase; }
  .card .value { font-size: 1.8rem; font-weight: 600; }
  section { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; overflow-x: auto; }
  section h2 { margin: 0 0 1rem; font-size: 1.1rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { padding: 0.5rem; border-bottom: 1px solid var(--border); text-align: left; }
  th { background: #fafafa; font-weight: 600; }
  .small { font-size: 0.8rem; color: var(--muted); }
  .error { color: #991b1b; }
  canvas { width: 100%; height: 240px; }
  .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .toolbar button { padding: 0.4rem 0.8rem; border: 1px solid var(--border); background: #fff; border-radius: 4px; cursor: pointer; }
  .toolbar button.active { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
  .overview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .overview-header h2 { margin: 0; font-size: 1.1rem; }
</style>
</head>
<body>
<header>
  <h1>FRKN Business Dashboard</h1>
  <span class="small" id="status"></span>
</header>
<main>
  <div class="overview-header">
    <h2 id="overview-title">Overview (Today)</h2>
    <div class="toolbar" id="overview-toolbar">
      <button class="active" data-period="today">Today</button>
      <button data-period="yesterday">Yesterday</button>
      <button data-period="24h">24h</button>
      <button data-period="7d">7 days</button>
      <button data-period="30d">30 days</button>
      <button data-period="90d">90 days</button>
      <button data-period="month">Month</button>
    </div>
  </div>
  <div class="grid" id="overview">
    <div class="card"><h3>Visits</h3><div class="value" id="visits">-</div></div>
    <div class="card"><h3>Trials</h3><div class="value" id="trials">-</div></div>
    <div class="card"><h3>Conversions</h3><div class="value" id="conversions">-</div></div>
    <div class="card"><h3>Payments</h3><div class="value" id="payments">-</div></div>
    <div class="card"><h3>Revenue</h3><div class="value" id="revenue">-</div></div>
  </div>

  <section>
    <h2>Revenue over time</h2>
    <canvas id="revenue-chart"></canvas>
  </section>

  <section>
    <h2>Visits over time</h2>
    <canvas id="visits-chart"></canvas>
  </section>

  <section>
    <h2>Sales breakdown</h2>
    <div id="sales-breakdown"><p class="small">Loading…</p></div>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);

  function setStatus(msg, isError) {
    const el = $('status');
    el.textContent = msg;
    el.className = isError ? 'error' : 'small';
  }

  function formatCurrency(value) {
    return Math.round(value).toLocaleString() + ' ₽';
  }

  async function loadOverview(period) {
    try {
      const data = await fetch(`api/overview?period=${period}`).then(r => r.json());
      $('visits').textContent = data.visits.toLocaleString();
      $('trials').textContent = data.trials.toLocaleString();
      $('conversions').textContent = data.conversions.toLocaleString();
      $('payments').textContent = data.payments.toLocaleString();
      $('revenue').textContent = formatCurrency(data.revenue);
    } catch (e) {
      setStatus('overview error: ' + e.message, true);
    }
  }

  async function loadSales(period) {
    try {
      const data = await fetch(`api/sales?period=${period}`).then(r => r.json());
      renderRevenueChart(data.data || []);
      renderSalesBreakdown(data.data || []);
    } catch (e) {
      setStatus('sales error: ' + e.message, true);
    }
  }

  async function loadVisits(period) {
    try {
      const data = await fetch(`api/pixel?period=${period}`).then(r => r.json());
      renderVisitsChart(data.series || []);
    } catch (e) {
      setStatus('visits error: ' + e.message, true);
    }
  }

  function renderRevenueChart(buckets) {
    const points = buckets.slice().reverse().map(b => ({ x: new Date(b.bucket).getTime(), y: b.revenue || 0 }));
    drawChart($('revenue-chart'), points, 'Revenue');
  }

  function renderVisitsChart(series) {
    const visits = (series || []).filter(s => s.metric === 'web.visits.total');
    const map = new Map();
    visits.forEach(s => {
      s.points.forEach(p => {
        map.set(p.x, (map.get(p.x) || 0) + (p.y || 0));
      });
    });
    const points = Array.from(map.entries()).sort((a, b) => a[0] - b[0]).map(([x, y]) => ({ x, y }));
    drawChart($('visits-chart'), points, 'Visits');
  }

  function renderSalesBreakdown(buckets) {
    const el = $('sales-breakdown');
    if (!buckets.length) {
      el.innerHTML = '<p class="small">No data</p>';
      return;
    }

    function mergeRows(rows) {
      const map = new Map();
      (rows || []).forEach(r => {
        const key = JSON.stringify(Object.keys(r).sort().map(k => [k, r[k]]));
        const existing = map.get(key);
        if (existing) {
          existing.count += r.count || 0;
          existing.revenue += r.revenue || 0;
        } else {
          map.set(key, { ...r, count: r.count || 0, revenue: r.revenue || 0 });
        }
      });
      return Array.from(map.values()).sort((a, b) => b.revenue - a.revenue);
    }

    const byType = mergeRows(buckets.flatMap(b => b.byType || []));
    const byDuration = mergeRows(buckets.flatMap(b => b.byDuration || []));
    const byPromocode = mergeRows(buckets.flatMap(b => b.byPromocode || []));

    const sections = [];
    if (byType.length) {
      sections.push('<h3>By type</h3>' + renderRows(byType, ['type', 'count', 'revenue']));
    }
    if (byDuration.length) {
      sections.push('<h3>By duration</h3>' + renderRows(byDuration, ['durationDays', 'count', 'revenue']));
    }
    if (byPromocode.length) {
      sections.push('<h3>By promocode</h3>' + renderRows(byPromocode, ['promocode', 'count', 'revenue']));
    }

    el.innerHTML = sections.join('') || '<p class="small">No breakdown data</p>';
  }

  function renderRows(rows, keys) {
    const head = keys.map(k => `<th>${k}</th>`).join('');
    const body = rows.map(r => `<tr>${keys.map(k => `<td>${r[k] != null ? r[k] : '-'}</td>`).join('')}</tr>`).join('');
    return `<table><tr>${head}</tr>${body}</table>`;
  }

  function drawChart(canvas, points, label) {
    if (!points.length) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#999';
      ctx.fillText('No data', 10, 60);
      return;
    }
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(300, Math.floor(rect.width)) || 300;
    canvas.height = 240;
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;
    const pad = 30;

    const minX = points[0].x;
    const maxX = points[points.length - 1].x;
    const values = points.map(p => p.y);
    let minY = Math.min(...values);
    let maxY = Math.max(...values);
    if (minY === maxY) { minY = 0; maxY = maxY || 1; }

    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = '#e5e7eb';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad, pad);
    ctx.lineTo(pad, h - pad);
    ctx.lineTo(w - pad, h - pad);
    ctx.stroke();

    ctx.strokeStyle = '#1a1a2e';
    ctx.lineWidth = 2;
    ctx.beginPath();
    points.forEach((p, i) => {
      const x = pad + (maxX === minX ? 0 : (p.x - minX) / (maxX - minX)) * (w - 2 * pad);
      const y = h - pad - (maxY === minY ? 0 : (p.y - minY) / (maxY - minY)) * (h - 2 * pad);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();

    ctx.fillStyle = '#666';
    ctx.font = '11px sans-serif';
    ctx.fillText(label, pad + 4, pad - 6);
    ctx.fillText(Math.round(maxY).toLocaleString(), 2, pad + 8);
    ctx.fillText(Math.round(minY).toLocaleString(), 2, h - pad - 4);
  }

  let overviewPeriod = 'today';

  document.querySelectorAll('#overview-toolbar button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#overview-toolbar button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      overviewPeriod = btn.dataset.period;
      $('overview-title').textContent = 'Overview (' + btn.textContent + ')';
      refresh();
    });
  });

  async function refresh() {
    await Promise.all([
      loadOverview(overviewPeriod),
      loadSales(overviewPeriod),
      loadVisits(overviewPeriod)
    ]);
    setStatus('updated ' + new Date().toLocaleTimeString());
  }

  refresh();
  setInterval(refresh, 30000);
</script>
</body>
</html>
