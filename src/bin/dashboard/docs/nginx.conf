upstream dashboard {
    server 127.0.0.1:9103;
}

server {
    listen 443 ssl http2;
    server_name dashboard.frkn.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/dashboard.frkn.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.frkn.org/privkey.pem;

    location / {
        auth_basic "FRKN Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd_dashboard;

        proxy_pass http://dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
