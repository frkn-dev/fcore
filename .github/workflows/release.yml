name: Release

# Builds run on the self-hosted build server
# (frkn-services: deploy/server-release.sh). Manual emergency use only.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Test
        run: cargo test --lib

  build-and-release:
    needs: [tests]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Install Build Tools
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          pip3 install ziglang
          cargo install cargo-zigbuild

      - name: Build Node (x86_64)
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu --bin node --features xray,wireguard,amnezia-wg

      - name: Build Node (aarch64)
        run: cargo zigbuild --release --target aarch64-unknown-linux-gnu --bin node --features xray,wireguard,amnezia-wg

      - name: Build Node (armv7)
        run: cargo zigbuild --release --target armv7-unknown-linux-gnueabihf --bin node --features xray,wireguard,amnezia-wg

      - name: Build API
        run: cargo build --release --bin api --no-default-features

      - name: Build Auth
        run: cargo build --release --bin auth --no-default-features

      - name: Prepare release files
        run: |
          mkdir -p release_dist
          cp target/x86_64-unknown-linux-gnu/release/node release_dist/node-x86_64
          cp target/aarch64-unknown-linux-gnu/release/node release_dist/node-aarch64
          cp target/armv7-unknown-linux-gnueabihf/release/node release_dist/node-armv7
          cp target/release/api release_dist/api-x86_64
          cp target/release/auth release_dist/auth-x86_64
          chmod +x release_dist/*

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release_dist/*
            docs/*
            README.md
            src/bin/api/api-example.toml
            src/bin/auth/auth-example.toml
            src/bin/node/node-example.toml
            src/bin/api/api.service
            src/bin/auth/auth.service
            src/bin/node/node.service
            deploy/*.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
