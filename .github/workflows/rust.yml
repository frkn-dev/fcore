name: fcore build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Test Lib
        run: cargo test --lib

  build-node:
    needs: [tests]
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler musl-tools

      - name: Install musl cross toolchain (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          wget -q https://musl.cc/aarch64-linux-musl-cross.tgz
          tar xf aarch64-linux-musl-cross.tgz
          echo "CC_aarch64_unknown_linux_musl=$PWD/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc" >> $GITHUB_ENV
          echo "AR_aarch64_unknown_linux_musl=$PWD/aarch64-linux-musl-cross/bin/aarch64-linux-musl-ar" >> $GITHUB_ENV

      - name: Build Node
        run: |
          cargo build --release \
            --bin node \
            --target ${{ matrix.target }} \
            --features xray,wireguard,amnezia-wg

      - name: Verify binary
        run: |
          file target/${{ matrix.target }}/release/node
          ldd target/${{ matrix.target }}/release/node || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcore-node-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/node

  build-api:
    needs: [tests]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler musl-tools

      - name: Build API
        run: |
          cargo build --release \
             --bin api \
             --no-default-features \
             --target x86_64-unknown-linux-musl

      - name: Verify binary
        run: |
          file target/x86_64-unknown-linux-musl/release/api
          ldd target/x86_64-unknown-linux-musl/release/api || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcore-api
          path: target/x86_64-unknown-linux-musl/release/api

  build-auth:
    needs: [tests]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler musl-tools

      - name: Build Auth
        run: |
          cargo build --release \
            --bin auth \
            --no-default-features \
            --target x86_64-unknown-linux-musl

      - name: Verify binary
        run: |
          file target/x86_64-unknown-linux-musl/release/auth
          ldd target/x86_64-unknown-linux-musl/release/auth || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcore-auth
          path: target/x86_64-unknown-linux-musl/release/auth

  collect-binaries:
    runs-on: ubuntu-latest
    needs: [build-node, build-api, build-auth]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected
          pattern: fcore-*
          merge-multiple: false

      - name: Upload combined bundle
        uses: actions/upload-artifact@v4
        with:
          name: fcore-full-bundle
          path: collected/
