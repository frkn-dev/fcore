name: fcore build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Test Lib
        run: cargo test --lib

  build-node:
    needs: [tests]
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross

      - name: Build Node
        run: |
          cross build --release \
            --bin node \
            --target ${{ matrix.target }} \
            --features xray,wireguard,amnezia-wg

      - name: Verify binary
        run: |
          file target/${{ matrix.target }}/release/node
          ldd target/${{ matrix.target }}/release/node || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcore-node-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/node

  build-api:
    needs: [tests]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: api

      - name: Install cross
        run: cargo install cross

      - name: Build API
        run: |
          cross build --release \
             --bin api \
             --no-default-features \
             --target x86_64-unknown-linux-musl

      - name: Verify binary
        run: |
          file target/x86_64-unknown-linux-musl/release/api
          ldd target/x86_64-unknown-linux-musl/release/api || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcore-api
          path: target/x86_64-unknown-linux-musl/release/api

  build-auth:
    needs: [tests]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: auth

      - name: Install cross
        run: cargo install cross

      - name: Build Auth
        run: |
          cross build --release \
            --bin auth \
            --no-default-features \
            --target x86_64-unknown-linux-musl

      - name: Verify binary
        run: |
          file target/x86_64-unknown-linux-musl/release/auth
          ldd target/x86_64-unknown-linux-musl/release/auth || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcore-auth
          path: target/x86_64-unknown-linux-musl/release/auth

  build-pixel-agent:
    needs: [tests]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: pixel-agent

      - name: Install cross
        run: cargo install cross

      - name: Build Pixel Agent
        run: |
          cross build --release \
            --bin pixel-agent \
            --no-default-features \
            --target x86_64-unknown-linux-musl

      - name: Verify binary
        run: |
          file target/x86_64-unknown-linux-musl/release/pixel-agent
          ldd target/x86_64-unknown-linux-musl/release/pixel-agent || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcore-pixel-agent
          path: target/x86_64-unknown-linux-musl/release/pixel-agent

  collect-binaries:
    runs-on: ubuntu-latest
    needs: [build-node, build-api, build-auth, build-pixel-agent]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected
          pattern: fcore-*
          merge-multiple: false

      - name: Upload combined bundle
        uses: actions/upload-artifact@v4
        with:
          name: fcore-full-bundle
          path: collected/
