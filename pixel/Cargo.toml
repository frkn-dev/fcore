[package]
name = "pixel"
version = "0.1.0"
edition = "2021"

[profile.release]
strip = true
debug = false
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1.0"
flate2 = "1"
maxminddb = "0.24"
nom = "7"
parking_lot = "0.12.5"
rkyv = { version = "0.7", features = ["std", "alloc", "validation"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2.1.3"
uuid = { version = "1", features = ["serde", "v4"] }
warp = "0.3"

[[bin]]
name = "pixel-agent"
path = "src/main.rs"

[[bin]]
name = "pixel-agent-backfill"
path = "src/backfill.rs"
