# /etc/nginx/snippets/frkn-geo.conf
# Included from the api.frkn.org server block, above `location /`.
#
# /router/geo/* is served from /var/lib/frkn/geo by the njs handler
# (/etc/nginx/frkn-geo.js), never from the api binary: adding a zone is a file
# + a name in this whitelist + `nginx -s reload`, not an api release. The
# response (bodies, ETag = "sha256:<file hash>", Last-Modified, 304, 404, 405,
# 503) is byte-identical to the handler it replaced — see
# ffcore/docs/router-geo.md § «Зоны отдаёт nginx».
#
# The whitelist is the authoritative list of zone names. Everything else under
# the prefix is 404, so a path can never become a file name.
location ~ ^/router/geo/(ru|ai4|aicn4|exch4|youtube4|gov4|adult4)\.zone(\.sha256|\.count)?$ {
    js_content frkn_geo.serve;
    # Bodies must stay byte-identical: gzip would change what a consumer that
    # hashes the body sees (and the sha256 ETag would then lie).
    gzip off;
    # No default content type: a 304 must carry only ETag/Last-Modified/
    # Cache-Control, exactly like the api's 304. The 200 path sets its own.
    default_type "";
}

# Unknown zone name, `/router/geo/`, a traversal attempt, `.zone.bak`:
# the api used to answer 405 here only because its generic route matched the
# path first; 404 is what "no such zone" means.
location /router/geo/ {
    return 404;
}
