# /etc/nginx/conf.d/frkn-geo-js.conf
#
# The njs handler that serves /router/geo/* from the zone files on disk.
# http-level (conf.d is included inside `http {}` in nginx.conf, before
# sites-enabled), so the import is visible to the api vhost.
#
# Package: libnginx-mod-http-js (module loaded by
# /etc/nginx/modules-enabled/50-mod-http-js.conf).
js_import frkn_geo from /etc/nginx/frkn-geo.js;
