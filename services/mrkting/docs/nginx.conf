upstream mrkting {
    server 127.0.0.1:9103;
}

server {
    listen 443 ssl http2;
    server_name api.frkn.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.frkn.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.frkn.org/privkey.pem;

    location /account {
        proxy_pass http://mrkting;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /validate/ref_code {
        proxy_pass http://mrkting;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /referrals {
        proxy_pass http://mrkting;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /subscription/by_ref_code {
        proxy_pass http://mrkting;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
